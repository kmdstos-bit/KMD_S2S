name: Sync fork with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:  # manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # token: ${{ secrets.SYNC_PAT }}  # needed only if a push touches .github/workflows/*

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/alecjong-lab/ECMWF-S2S4AFRICA

      - name: Fetch upstream
        run: |
          git fetch upstream main
          git fetch upstream website

      - name: Record pre-merge commit
        id: pre_merge
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream changes
        run: |
          # Attempt the merge but don't auto-commit, and don't let git fail the step on conflicts
          git merge upstream/main --no-commit --no-ff || true

          # Resolve any conflicts inside protected paths by always keeping our version
          git checkout --ours -- .github/workflows plots data 2>/dev/null || true
          git add .github/workflows plots data 2>/dev/null || true

          # Any conflicts left are outside protected paths -> needs human attention, fail loudly
          remaining=$(git diff --name-only --diff-filter=U)
          if [ -n "$remaining" ]; then
            echo "::error::Unresolved merge conflicts outside protected paths:"
            echo "$remaining"
            exit 1
          fi

          git commit -m "Merge upstream/main (protected paths preserved)" --allow-empty

      - name: Restore protected paths to fork's state
        run: |
          PRE_SHA="${{ steps.pre_merge.outputs.sha }}"

          # Restore/delete any tracked files under protected paths back to pre-merge state
          git checkout "$PRE_SHA" -- .github/workflows plots data 2>/dev/null || true

          # Remove any brand-new untracked files/folders the merge introduced under these paths
          git status --porcelain | awk '/^\?\?/{print $2}' | grep -E '^(\.github/workflows|plots|data)/' | xargs -r rm -rf

          git add -A
          git diff --cached --quiet || git commit -m "Restore protected paths after sync"

      - name: Push changes
        run: git push origin main
