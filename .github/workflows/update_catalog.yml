name: Convert GRIB & Update Catalog

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at 12:00 UTC
  workflow_dispatch:        # Allow manual runs

jobs:
  convert-and-catalog:
    runs-on: ubuntu-latest

    # ----------------------------------------------------------------
    # Variables — adjust these without touching the rest of the workflow
    # ----------------------------------------------------------------
    env:
      DATA_BRANCH: main
      WEBSITE_BRANCH: website
      DATA_DIR: data               # root folder on main branch
      OUTPUT_DIR: data             # output folder on website branch
      CATALOG_PATH: data/weekly/catalog.json   # path on website branch

      # Comma-separated list of variable names as they appear in filenames
      # e.g. a file called ...forecast_precip_42days... → "precip"
      VARIABLES: "temp,precip,wind_speed,rh,mslp"

      # Number of forecast weeks in each GRIB file
      N_WEEKS: "6"

      # How many forecast dates to retain on the website branch (older ones are deleted)
      KEEP_FORECASTS: "7"

    steps:
      # ── 1. Check out data (main branch) ──────────────────────────
      - name: Check out main branch (data)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: main_branch

      # ── 2. Check out website branch ──────────────────────────────
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEBSITE_BRANCH }}
          path: website_branch

      # ── 3. Set up Python ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Install dependencies ───────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install cfgrib eccodes xarray numpy

      # ── 5. Run conversion + catalog update ───────────────────────
      - name: Convert GRIB files and update catalog
        run: |
          python main_branch/scripts/grib_to_json_and_catalog.py \
            --data-dir    "main_branch/${{ env.DATA_DIR }}" \
            --output-dir  "website_branch/${{ env.OUTPUT_DIR }}" \
            --catalog     "website_branch/${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      # ── 6. Commit & push changes to website branch ───────────────
      - name: Commit and push to website branch
        run: |
          cd website_branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.OUTPUT_DIR }}" "${{ env.CATALOG_PATH }}"

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — catalog is already up to date."
          else
            git commit -m "chore: update catalog and JSON data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin ${{ env.WEBSITE_BRANCH }}
          fi
