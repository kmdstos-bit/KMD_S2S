<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Africa Weather Model Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar Controls -->
        <<div id="sidebar">
            <div class="sidebar-header">
                <h2>🌍 Africa Weekly Weather</h2>
                <p style="font-size: 0.9em; opacity: 0.8; margin-top: -10px;">
                    Sub-seasonal to Seasonal Forecast
                </p>
            </div>
            
            <div class="control-group">
                <label for="init-date">Initialization Date:</label>
                <select id="init-date">
                    <option value="">Loading...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="variable">Variable:</label>
                <select id="variable">
                    <option value="">Select variable</option>
                    <option value="temp">Weekly Mean Temperature (°C)</option>
                    <option value="precip">Weekly Total Precipitation (mm)</option>
                    <option value="wind_speed"> Weekly Mean Wind Speed (m/s)</option>
                    <option value="rh">Weekly Mean Relative Humidity (%)</option>
                    <option value="mslp"> Weekly Mean Sea Level Pressure (hPa)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="week">Forecast Week:</label>
                <select id="week">
                    <option value="">Select week</option>
                </select>
                <div id="week-dates" style="font-size: 0.8em; margin-top: 5px; opacity: 0.8;"></div>
            </div>
            
            <div class="control-group">
                <label>Layer Opacity:</label>
                <input type="range" id="opacity" min="0" max="100" value="70">
                <span id="opacity-value">70%</span>
            </div>

            <div class="control-group">
                <button id="reset-view" style="width: 100%; padding: 10px; 
                        background: rgba(255,255,255,0.2); 
                        border: 2px solid rgba(255,255,255,0.3); 
                        border-radius: 6px; color: white; 
                        cursor: pointer; font-size: 0.9em;
                        transition: background 0.3s;"
                        onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                        onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    🔍 Reset View
                </button>
            </div>
                        
            <div class="legend" id="legend">
                <h4>Legend</h4>
                <div id="legend-content"></div>
            </div>
            
            <div class="info-box">
                <p><strong>Data Source:</strong> ECMWF S2S</p>
                <p><strong>Resolution:</strong> 0.5°</p>
                <p><strong>Forecast Range:</strong> Week 1-6</p>
                <p id="update-time">Last updated: Loading...</p>
            </div>
        </div>
        
        <!-- Map Container -->
        <div id="map"></div>
        
        <!-- Loading Indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Plugins -->
    <!-- <script src="https://unpkg.com/leaflet-canvaslayer-field@1.0.0/dist/leaflet-canvaslayer-field.min.js"></script> -->
    
    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/map.js"></script>
    <script src="js/controls.js"></script>
</body>
</html>
