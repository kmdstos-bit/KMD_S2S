<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Africa S2S Viewer</title>
    
   <title>Africa S2S Weather Viewer</title>
    
    <!-- Favicon - shows in browser tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌍</text></svg>">
    
    <!-- Also add for Apple devices -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌍</text></svg>">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar Controls -->
       <div id="sidebar">
    <div class="sidebar-header" style="margin-bottom: 10px; padding-bottom: 5px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 0; padding: 0;">
            <h2 style="margin: 0; padding: 0; font-size: 1.3em;">🌍 Africa S2S Viewer</h2>
            <button id="sidebar-toggle" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); 
                    color: white; font-size: 1.2em; cursor: pointer; padding: 3px 8px; border-radius: 4px; 
                    transition: all 0.3s; min-width: 40px; line-height: 1;"
                    onmouseover="this.style.background='rgba(255,255,255,0.4)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.2)'"
                    title="Toggle sidebar">
                ◀
            </button>
        </div>
    </div>

    <!-- Hint text - moved closer -->
    <div style="font-size: 0.65em; opacity: 0.5; text-align: center; margin: -5px 0 10px 0; padding: 0; line-height: 1;">
        Press q to toggle sidebar
    </div>
            
            <div class="control-group">
                <label for="init-date">Initialization Date:</label>
                <select id="init-date">
                    <option value="">Loading...</option>
                </select>
            </div>
            
          <div class="control-group">
            <label for="variable">Variable:</label>
            <select id="variable">
                <option value="">Select variable</option>
                <option value="temp">Weekly Mean Temperature (°C)</option>
                <option value="precip">Weekly Total Precipitation (mm)</option>
                <option value="tcw">Weekly Mean Total Column Water (kg/m²)</option>
                <option value="cape">Weekly Mean CAPE (J/kg)</option>
                <option value="d2m">Weekly Mean Relative Dewpoint Temperature (°C)</option>
                <option value="mx2t6">Weekly Mean Max Temperature (°C)</option>
                <option value="mn2t6">Weekly Mean Min Temperature (°C)</option>
                <option value="w500">Weekly Mean 500hPa Vertical Wind (m/s)</option>
                <option value="u10">Weekly Mean 10m U-Wind (m/s)</option>
                <option value="v10">Weekly Mean 10m V-Wind (m/s)</option>
                <option value="u700">Weekly Mean 700hPa U-Wind (m/s)</option>
                <option value="v700">Weekly Mean 700hPa V-Wind (m/s)</option>
            </select>
        </div>
            
            <div class="control-group">
                <label for="week">Forecast Week:</label>
                <select id="week">
                    <option value="">Select week</option>
                </select>
                <div id="week-dates" style="font-size: 0.8em; margin-top: 5px; opacity: 0.8;"></div>
            </div>
            
            <div class="control-group">
                <label>Layer Opacity:</label>
                <input type="range" id="opacity" min="0" max="100" value="70">
                <span id="opacity-value">70%</span>
            </div>

            <!-- Color Scale Controls -->
            <div class="control-group" id="color-scale-controls">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Color Scale Range</span>
                    <div style="display: flex; gap: 5px;">
                        <button id="auto-scale" style="padding: 3px 8px; font-size: 0.75em; 
                                background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); 
                                border-radius: 4px; color: white; cursor: pointer;">
                            Auto
                        </button>
                        <button id="auto-scale-viewport" style="padding: 3px 6px; font-size: 0.65em; 
                                background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); 
                                border-radius: 4px; color: white; cursor: pointer;"
                                title="Auto-scale to visible area only">
                            🖼️
                        </button>
                    </div>
                </label>
                
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div style="flex: 1;">
                        <label for="vmin" style="font-size: 0.8em;">Min</label>
                        <input type="number" id="vmin" style="width: 100%; padding: 6px; 
                            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); 
                            border-radius: 4px; color: white;" step="any">
                    </div>
                    <div style="flex: 1;">
                        <label for="vmax" style="font-size: 0.8em;">Max</label>
                        <input type="number" id="vmax" style="width: 100%; padding: 6px; 
                            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); 
                            border-radius: 4px; color: white;" step="any">
                    </div>
                </div>
                
                <div style="margin-top: 5px; font-size: 0.7em; opacity: 0.7;" id="data-range-info"></div>
            </div>

            <div class="control-group">
                <button id="reset-view" style="width: 100%; padding: 10px; 
                        background: rgba(255,255,255,0.2); 
                        border: 2px solid rgba(255,255,255,0.3); 
                        border-radius: 6px; color: white; 
                        cursor: pointer; font-size: 0.9em;
                        transition: background 0.3s;"
                        onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                        onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    🔍 Reset View
                </button>
            </div>
                        

            
            <div class="info-box">
                <p><strong>Data Source:</strong> ECMWF S2S</p>
                <p><strong>Resolution:</strong> 0.5°</p>
                <p><strong>Forecast Range:</strong> Week 1-6</p>
                <p id="update-time">Last updated: Loading...</p>
            </div>
        </div>
        
        <!-- Map Container -->
        <div id="map"></div>
        
        <!-- Loading Indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>
    </div>

    <!-- Floating Legend - Bottom Right -->
    <div id="floating-legend" style="position: absolute; bottom: 30px; right: 10px; z-index: 1000;
            background: rgba(30, 30, 30, 0.85); color: white; padding: 10px 15px;
            border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            min-width: 200px; transition: all 0.3s;"
            onclick="openColorPicker()"
            onmouseover="this.style.background='rgba(30,30,30,0.95)'"
            onmouseout="this.style.background='rgba(30,30,30,0.85)'"
            title="Click to adjust color scale">
        <div style="font-size: 0.7em; opacity: 0.7; text-align: center; margin-bottom: 3px;">Click to adjust</div>
        <div id="floating-legend-content"></div>
    </div>

    <!-- Color Picker Modal -->
    <div id="colorpicker-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; justify-content: center; align-items: center;">
        
        <!-- Blur overlay -->
        <div id="colorpicker-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);"
                onclick="closeColorPicker()"></div>
        
        <!-- Color Picker Panel -->
        <div id="colorpicker-panel" style="position: relative; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: white; padding: 25px; border-radius: 16px; min-width: 350px; max-width: 400px;
                border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                z-index: 1;">
            <!-- ... rest of modal content ... -->
        </div>
            <h3 style="margin: 0 0 15px 0; font-size: 1.2em; text-align: center;">🎨 Color Scale Settings</h3>
            
            <!-- Current range display -->
            <div id="colorpicker-legend-preview" style="margin-bottom: 20px;"></div>
            
            <!-- VMin / VMax inputs -->
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label for="modal-vmin" style="font-size: 0.8em; opacity: 0.8;">Min</label>
                    <input type="number" id="modal-vmin" step="any"
                        style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); 
                        border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; font-size: 1em;">
                </div>
                <div style="flex: 1;">
                    <label for="modal-vmax" style="font-size: 0.8em; opacity: 0.8;">Max</label>
                    <input type="number" id="modal-vmax" step="any"
                        style="width: 100%; padding: 10px; background: rgba(255,255,255,0.1); 
                        border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; font-size: 1em;">
                </div>
            </div>
            
            <!-- Auto-scale buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="modal-auto-all" style="flex: 1; padding: 10px; background: rgba(255,255,255,0.15); 
                        border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; cursor: pointer;
                        font-size: 0.85em; transition: all 0.2s;"
                        onmouseover="this.style.background='rgba(255,255,255,0.25)'"
                        onmouseout="this.style.background='rgba(255,255,255,0.15)'">
                    📊 All Data
                </button>
                <button id="modal-auto-viewport" style="flex: 1; padding: 10px; background: rgba(255,255,255,0.15); 
                        border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; cursor: pointer;
                        font-size: 0.85em; transition: all 0.2s;"
                        onmouseover="this.style.background='rgba(255,255,255,0.25)'"
                        onmouseout="this.style.background='rgba(255,255,255,0.15)'">
                    🖼️ Viewport
                </button>
            </div>
            
            <!-- Apply button -->
            <button id="modal-apply" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); 
                    border: none; border-radius: 8px; color: white; font-size: 1em; font-weight: 600; cursor: pointer;
                    transition: all 0.2s; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);"
                    onmouseover="this.style.transform='translateY(-2px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                ✅ Apply Changes
            </button>
            
            <!-- Close hint -->
            <p style="text-align: center; font-size: 0.7em; opacity: 0.5; margin: 10px 0 0 0;">
                Click outside or press ESC to cancel
            </p>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Plugins -->
    <!-- <script src="https://unpkg.com/leaflet-canvaslayer-field@1.0.0/dist/leaflet-canvaslayer-field.min.js"></script> -->
    
    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/map.js"></script>
    <script src="js/controls.js"></script>
</body>
</html>
